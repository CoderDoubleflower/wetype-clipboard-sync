[package]
name = "wxclipd"
version = "0.5.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
description = "Windows clipboard sync for WeType cross-device clipboard"
publish = false

[[bin]]
name = "wxclipd"
path = "src/main.rs"

[[bin]]
name = "wxclipd-background"
path = "src/background.rs"

[features]
default = []
vendored-openssl = ["wx-ime-sdk/vendored-openssl"]

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
sha2 = "0.10"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "time",
    "signal",
    "io-util",
    "net",
    "sync",
] }
wx-ime-sdk = { path = "../vendor/wx-ime-sdk/crates/wx-ime-sdk" }

[target.'cfg(windows)'.dependencies]
arboard = { version = "3.6", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
strip = true
