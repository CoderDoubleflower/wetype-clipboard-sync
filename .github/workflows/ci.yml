name: CI and Windows Release

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: '1.92.0'

jobs:
  windows:
    name: Windows x86 build, tests and installer
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_TARGET_I686_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - uses: arduino/setup-protoc@v3
        with:
          version: '29.3'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install x86 Rust and OpenSSL build tools
        shell: pwsh
        run: |
          rustup toolchain install "${env:RUST_VERSION}-i686-pc-windows-msvc" --profile minimal --component rustfmt --force-non-host
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          choco install nasm --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NASM installation failed' }
          'C:\Program Files\NASM' | Out-File -FilePath $env:GITHUB_PATH -Append
          'C:\Strawberry\perl\bin' | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Check formatting
        shell: pwsh
        run: |
          $Toolchain = "$env:RUST_VERSION-i686-pc-windows-msvc"
          cargo +$Toolchain fmt --manifest-path wxclipd/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { throw 'Application formatting check failed' }
          cargo +$Toolchain fmt --manifest-path vendor/wx-ime-sdk/Cargo.toml --all --check
          if ($LASTEXITCODE -ne 0) { throw 'Protocol workspace formatting check failed' }
      - name: Restore Windows build cache
        id: windows-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wxclipd/target
            vendor/wx-ime-sdk/target
          key: windows-x86-static-rust-1.92-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            windows-x86-static-rust-1.92-
      - name: Test Windows daemon and protocol workspace
        shell: pwsh
        run: |
          $Toolchain = "$env:RUST_VERSION-i686-pc-windows-msvc"
          # Test the daemon and its SDK using the exact release lockfile/profile.
          # Sharing the target directory avoids serial OpenSSL rebuilds for a
          # second workspace and for separate debug/release profiles on MSVC.
          cargo +$Toolchain test --locked --release --manifest-path wxclipd/Cargo.toml -p wxclipd -p wx-ime-sdk -p wx-ime-protocol --features wxclipd/vendored-openssl --target i686-pc-windows-msvc -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Windows daemon and protocol tests failed' }
      - name: Build Windows x86 release
        shell: pwsh
        run: |
          cargo +"$env:RUST_VERSION-i686-pc-windows-msvc" build --locked --release --manifest-path wxclipd/Cargo.toml --features vendored-openssl --target i686-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Windows release build failed' }
      - name: Save tested Windows build cache
        if: steps.windows-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wxclipd/target
            vendor/wx-ime-sdk/target
          key: ${{ steps.windows-cache.outputs.cache-primary-key }}
      - name: Build Windows x86 installer
        timeout-minutes: 12
        shell: pwsh
        run: |
          $Manifest = Get-Content wxclipd/Cargo.toml -Raw
          $Version = [regex]::Match($Manifest, '(?m)^version = "([^"]+)"').Groups[1].Value
          ./packaging/windows/build-package.ps1 -Version $Version
      - name: Verify Windows x86 installer and tray
        timeout-minutes: 12
        shell: pwsh
        run: |
          $Manifest = Get-Content wxclipd/Cargo.toml -Raw
          $Version = [regex]::Match($Manifest, '(?m)^version = "([^"]+)"').Groups[1].Value
          ./packaging/windows/verify-package.ps1 -Version $Version
      - name: Upload Windows diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-diagnostics
          if-no-files-found: ignore
          path: |
            dist/windows-tray-status*.png
            dist/wpf-verification/*
      - name: Upload tested Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86
          if-no-files-found: error
          path: |
            dist/*-windows-x86-setup.exe
            dist/*-windows-x86-portable.zip
            dist/SHA256SUMS.txt

  release:
    name: Publish Windows release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86
          path: dist
      - name: Publish versioned packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $Manifest = Get-Content wxclipd/Cargo.toml -Raw
          $Version = [regex]::Match($Manifest, '(?m)^version = "([^"]+)"').Groups[1].Value
          if (-not $Version) { throw 'Package version is missing' }
          $Tag = "v$Version"
          gh release view $Tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $Tag already exists; preserving its published assets."
            exit 0
          }
          $Assets = @(
            "dist/wetype-clipboard-sync-$Version-windows-x86-setup.exe",
            "dist/wetype-clipboard-sync-$Version-windows-x86-portable.zip",
            'dist/SHA256SUMS.txt'
          )
          foreach ($Asset in $Assets) {
            if (-not (Test-Path $Asset -PathType Leaf)) { throw "Missing release asset: $Asset" }
          }
          gh release create $Tag @Assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "$Tag — Windows clipboard sync" --notes-file packaging/windows/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
