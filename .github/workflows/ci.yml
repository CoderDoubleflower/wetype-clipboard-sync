name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
      - name: 构建 wxclipd
        run: cargo build --release --manifest-path wxclipd/Cargo.toml -j 3
      - name: 协议层测试
        run: cargo test --workspace --manifest-path vendor/wx-ime-sdk/Cargo.toml -j 3
